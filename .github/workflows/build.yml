name: Windows EXE ビルド

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: EXE をビルド
        run: |
          pyinstaller "ハローワーク求人情報収集ツール.spec" --noconfirm

      - name: ビルド成功確認
        run: |
          if (Test-Path "dist\HelloWorkJobScraper.exe") {
            $size = (Get-Item "dist\HelloWorkJobScraper.exe").Length / 1MB
            Write-Host "Build succeeded: $([math]::Round($size,1)) MB"
          } else {
            Write-Error "EXE not found"
            exit 1
          }

      - name: EXE をアーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorkJobScraper_Windows
          path: dist/HelloWorkJobScraper.exe
          retention-days: 30

      - name: EXE をリリースに添付（タグ付きプッシュ時のみ）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelloWorkJobScraper.exe
          name: ${{ github.ref_name }}
          body: |
            ## ハローワーク求人情報収集ツール ${{ github.ref_name }}

            ### ダウンロード
            下の **Assets** から `HelloWorkJobScraper.exe` をダウンロードしてください。
            **インストール不要・ダブルクリックで起動します。**
